<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaadi Saathi</title>

    <!-- Global & Common Components -->
    <link rel="stylesheet" href="/global/css/global.css" />
    <link rel="stylesheet" href="/global/css/sidebar.css" />
    <link rel="stylesheet" href="/global/css/header.css" />

    <!-- Third Party Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Essential reset to ensure the layout takes the full screen */
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background-color: var(--color-bg, #f8fafc); }
    </style>
</head>
<body>

    <!-- Main Layout Container -->
    <div id="layout" style="display: flex; min-height: 100vh;">
        
        <!-- The sidebar will be prepended here by main.js -->
        
        <div style="flex-grow: 1; display: flex; flex-direction: column; width: 100%;">
            <!-- The header-container is injected here by main.js -->
            
            <!-- The router injects page components here -->
            <main id="main-content" style="flex-grow: 1; padding: 20px;">
                <!-- Content dynamically loads here -->
            </main>
        </div>
    </div>

    <!-- Application Entry Point -->
    <script type="module" src="./global/js/main.js"></script>
    <script src="/global/js/security.js"></script>
</body>
</html>
