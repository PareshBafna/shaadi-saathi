<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding Invitation</title>
    <!-- Dynamic favicons and meta tags will be injected via JS -->
    
    <!-- Path updated to point to the css folder -->
    <link rel="stylesheet" href="global/css/splash.css">
    <link rel="stylesheet" href="global/css/invite.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Path updated to point to the js folder -->
    <script type="module" src="pages/web-invites-preview/web-invites-preview.js" defer></script>
</head>
<body>
    <div class="bg-image"></div>
    <canvas id="particles"></canvas>
    <div class="nav-dots"></div>

    <div id="splash-screen">
        <div class="envelope">      
            <div class="envelope-flap" id="env-flap"></div>
            <div id="seal-container">
                <div class="wax-seal">
                    <!-- Default fallback empty img, will be swapped via JS -->
                    <img id="seal-logo-img" src="" alt="Seal Logo" height="150" width="130" style="opacity: 0;">
                </div>
                <p class="seal-label">Tap to Open</p>
            </div>
        </div>
    </div>

    <!-- Container where JS will inject all the specific wedding details -->
    <main id="main-content-area"></main>

    <button class="back-to-top hidden" data-target="#welcome">↑</button>
    
    <!-- Path updated to point to the audio folder (assuming you have one) -->
    <audio id="bgMusic" src="global/audio/jashn-e-bahara-instrumental.mp3" loop preload="auto"></audio>
</body>
</html>
