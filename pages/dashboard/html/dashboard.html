<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shaadi Saathi</title>
    <!-- Stepping out: html -> dashboard -> pages -> root -> global -->
     <link rel="icon" type="image/x-icon" href="../../../assets/icons/favicon.ico">
    <link rel="stylesheet" href="../../../global/css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-shell" id="app">
        <aside id="sidebar"></aside>
        <div class="app-shell__main">
            <header id="header"></header>
            <main id="content" class="app-shell__content"></main>
        </div>
    </div>
    
    <script type="module">
        import { renderDashboard } from '../js/dashboard.js';
        import '../../../global/js/page-loader.js';
        
        const contentEl = document.getElementById('content');
        contentEl.appendChild(renderDashboard());
        
        // Secondary trigger for icons inside dynamically generated page content
        setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
