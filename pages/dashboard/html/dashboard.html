<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shaadi Saathi</title>
    <link rel="stylesheet" href="../../../global/css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Sidebar and Header logic injects here automatically -->
        <aside id="sidebar"></aside>
        
        <div class="main-wrapper">
            <header id="header"></header>
            <main id="content" class="content-area"></main>
        </div>
    </div>
    
    <script type="module">
        import { renderDashboard } from '../js/dashboard.js';
        import '../../../global/js/page-loader.js';
        
        const contentEl = document.getElementById('content');
        contentEl.appendChild(renderDashboard());
        
        // Secondary trigger for icons inside page content
        setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 100);
    </script>
</body>
</html>
