<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Command Center - Shaadi Saathi</title>
    <link rel="stylesheet" href="../../../../global/css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container" id="app">
        <aside id="sidebar"></aside>
        <div class="main-wrapper">
            <header id="header"></header>
            <main id="content" class="content-area"></main>
        </div>
    </div>
    <script type="module">
        import { renderWeddingCommandCenter } from '../js/wedding-command-center.js';
        import '../../../../global/js/page-loader.js';
        
        const urlParams = new URLSearchParams(window.location.search);
        const weddingId = urlParams.get('id');
        
        const contentEl = document.getElementById('content');
        contentEl.appendChild(renderWeddingCommandCenter(weddingId));
        
        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
    </script>
</body>
</html>
